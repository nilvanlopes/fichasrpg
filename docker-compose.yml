services:
  web:
    image: fichasrpg:latest
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    cap_drop:
      - ALL
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pyuserver
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: fichasrpg-api:latest
    read_only: true
    cap_drop:
      - ALL
    environment:
      DB_HOST: postgres
      DB_NAME: fichasrpg
      DB_USER: fichasrpg
      DB_PASSWORD_FILE: /run/secrets/fichasrpg_db_password
      PUBLIC_ORIGIN: https://fichasrpg.nilvanlopes.com
      AUTHENTIK_AUTH_URL: http://authentik-outpost-fichasrpg_proxy:9000/outpost.goauthentik.io/auth/traefik
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL:-https://authentik.nilvanlopes.com}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:?execute o deploy carregando as variáveis de autenticação}
      AUTHENTIK_INVITE_FLOW_SLUG: ${AUTHENTIK_INVITE_FLOW_SLUG:-foundry-enrollment}
      AUTHENTIK_FICHASRPG_GROUP_NAME: fichasrpg-users
      AUTHENTIK_FICHASRPG_USER_PATH: users/fichasrpg
      AUTHENTIK_FOUNDRY_GROUP_NAME: ${AUTHENTIK_FOUNDRY_GROUP_NAME:-foundry-users}
      AUTHENTIK_GOOGLE_SOURCE_SLUG: ${AUTHENTIK_GOOGLE_SOURCE_SLUG:-google}
      AUTHENTIK_FICHASRPG_APP_URL: https://fichasrpg.nilvanlopes.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    secrets:
      - source: fichasrpg_db_password
        target: fichasrpg_db_password
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks:
      - traefik-public
      - database
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pyuserver
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: fichasrpg
      POSTGRES_USER: fichasrpg
      POSTGRES_PASSWORD_FILE: /run/secrets/fichasrpg_db_password
    secrets:
      - fichasrpg_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pyuserver
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fichasrpg", "-d", "fichasrpg"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  traefik-public:
    external: true
  database:
    driver: overlay
    internal: true

volumes:
  postgres_data:
    external: true
    name: fichasrpg_postgres_data

secrets:
  fichasrpg_db_password:
    external: true
